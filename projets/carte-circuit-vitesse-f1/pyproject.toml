[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1carte"
version = "0.1.0"
description = "Carte de vitesse d'un circuit F1 à partir d'un tour de qualification (OpenF1 + matplotlib)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
