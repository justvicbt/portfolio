[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1engine"
version = "0.1.0"
description = "Analyse de stratégie et de télémétrie F1 (OpenF1 + SQLite + statsmodels)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
