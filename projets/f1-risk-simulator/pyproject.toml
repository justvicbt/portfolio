[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1risk"
version = "0.1.0"
description = "Simulateur Monte Carlo du risque d'un undercut en F1 (s'appuie sur f1engine, projet 1)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
