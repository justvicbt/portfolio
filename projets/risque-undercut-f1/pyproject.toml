[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1risk"
version = "0.1.0"
description = "Risque d'undercut F1 (Monte Carlo), s'appuie sur le Moteur de stratégie F1 (f1engine)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
